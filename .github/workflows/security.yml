name: Security (CodeQL)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  codeql-java:
    name: CodeQL Java
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4


  codeql-js:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Manual build step (if needed)
        run: echo "No build required for JS/TS"

      - name: Analyze
        uses: github/codeql-action/analyze@v4
