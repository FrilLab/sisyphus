name: API CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend.yml'
      - 'codecov.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend.yml'
      - 'codecov.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run backend quality checks
        run: ./gradlew clean check build

      - name: Verify JaCoCo XML report exists
        run: test -s build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: apps/api/build/reports/jacoco/test/jacocoTestReport.xml
          flags: backend
          name: backend
          fail_ci_if_error: false
          verbose: true
          use_oidc: true

      - name: Publish API test and quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-quality-reports
          path: |
            apps/api/build/reports/tests/test
            apps/api/build/reports/jacoco/test
            apps/api/build/reports/checkstyle
            apps/api/build/reports/spotbugs
            apps/api/build/generated/openapi/openapi.json
          if-no-files-found: warn
